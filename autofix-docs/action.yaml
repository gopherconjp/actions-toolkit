name: Autofix Docs
description: Fix Markdown with markdownlint and format docs with Oxfmt, then verify with lint-only check.

inputs:
  markdown-globs:
    description: Glob expression(s) of Markdown files to lint, newline-delimited.
    required: false
    default: "**/*.{md,markdown}"
  oxfmt-paths:
    description: Paths for Oxfmt to format, space-delimited.
    required: false
    default: '"**/*.md" "**/*.markdown" "**/*.yaml" "**/*.yml" "**/*.json" "**/*.jsonc" "**/*.json5" "**/*.toml"'
  enable-oxfmt:
    description: Whether to run Oxfmt formatting.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Fix Markdown
      continue-on-error: true
      uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
      with:
        fix: true
        globs: ${{ inputs.markdown-globs }}
    - name: Format with Oxfmt
      if: inputs.enable-oxfmt == 'true'
      env:
        OXFMT_VERSION: "0.71.0"
        OXFMT_PATHS: ${{ inputs.oxfmt-paths }}
      run: npx --yes "oxfmt@${OXFMT_VERSION}" --write --no-error-on-unmatched-pattern $OXFMT_PATHS
      shell: bash
    - name: Commit changes
      uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
    - name: Lint Markdown
      uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
      with:
        globs: ${{ inputs.markdown-globs }}
