language: "en-US"

reviews:
  profile: assertive
  request_changes_workflow: true

  path_filters:
    - "!.github/skills/**"
    - "!.github/instructions/**"
    - "!.github/copilot-instructions.md"

  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - "renovate[bot]"

  path_instructions:
    - path: "release/action.yaml"
      instructions: "Accept by design (do not report): single main branch operation with date-based PR detection, fixed main branch, and listReleases lookup."
    - path: ".github/workflows/**"
      instructions: "Accept by design (do not report): $/ is valid self-repository syntax; actionlint lacks support (rhysd/actionlint#711)."
