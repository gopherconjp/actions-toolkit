name: Verify Actions
description: Lint GitHub Actions workflows and composite actions with actionlint, ghalint, and zizmor.

runs:
  using: composite
  steps:
    - name: Run actionlint
      uses: reviewdog/action-actionlint@2085657ab2c7f48c58edcc767fba576f63bea76b # v1.77.0
      with:
        fail_level: error
    - name: Install ghalint
      env:
        GH_TOKEN: ${{ github.token }}
        GHALINT_VERSION: "v1.5.6"
      run: |
        set -eu -o pipefail

        install_dir="$RUNNER_TEMP/ghalint-bin"
        mkdir -p "$install_dir"
        cd "$install_dir"

        gh release download "$GHALINT_VERSION" -R suzuki-shunsuke/ghalint \
          -p 'ghalint_*_linux_amd64.tar.gz' \
          -p 'ghalint_*_checksums.txt'

        tarball=$(ls ghalint_*_linux_amd64.tar.gz)
        grep " $tarball$" ghalint_*_checksums.txt | sha256sum -c -
        tar -xzf "$tarball" ghalint
      shell: bash
    - name: Run ghalint
      run: |
        "$RUNNER_TEMP/ghalint-bin/ghalint" run
        "$RUNNER_TEMP/ghalint-bin/ghalint" run-action
      shell: bash
    - name: Run zizmor
      uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
      with:
        advanced-security: false
